<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="main.css" />
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="images/graceFavicon.png">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>GraceShop</title>
</head>

<body>
    <!-- MAIN -->
    <div class="d-flex justify-content-center align-items-center min-vh-100 text-center" id="coverElement">
        <div class="border border-5 card w-md-50 w-sm-25 h-100 p-5" style="border-style: double !important;">
            <span class="animate">
                <h1>
                    <img class="w-25 h-auto" src="images/graceLogo.png" alt="GraceLogo">
                    Shop
                </h1>
            </span>

            <hr>
            <div class="my-2" style="background-color: black; border: 5px double white;">
                <span class="animate" style="animation-delay: 2.5s;">
                    <img class="w-25 h-auto" src="images/graceGod.png" alt="God"><br>
                </span>
                <br>
                <span class="animate" style="animation-delay: 2s;">
                    <h4 class="text-white">
                        i'm no evil.
                    </h4>
                </span>
            </div>

            <p style="text-align: justify;" class="my-1">
                The website you are seeing now is inspired by the Roblox game
                <a href="https://www.roblox.com/games/138837502355157/Grace" class="text-decoration-none">
                    "Grace"
                </a>
                created by the Fartering Few. The game's story, items, and UI design are
                all spectacular to me, which made me want to celebrate it in this project.
                <hr>
            </p>

            <h2>NAVIGATION</h2>

            <div class="d-flex justify-content-center">
                <ol class="w-50">
                    <li>
                        <a href="pages/sku.html">SKU Generator</a>
                    </li>

                    <li>
                        <a href="pages/receipt.html">Receipt Generator</a>
                    </li>
                </ol>
            </div>

        </div>
    </div>
</body>

</html>
