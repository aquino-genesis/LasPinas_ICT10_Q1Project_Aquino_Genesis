<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../main.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="icon" type="image/x-icon" href="../images/graceFavicon.png">

        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

        <title>GraceShop - Receipt Generator</title>
    </head>

    <body>
        <!-- PYSCRIPT LOADING BUFFER -->
        <div id="loadingScreen">
            <div id="loadingScreenAnimY" style="animation-duration: 3s;">
                <div id="loadingScreenAnimX">
                    <img src="../images/graceGod.png" alt="God">
                </div>
            </div>

            <div style="position: relative;">
                <div style="animation-delay: -0.9s" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.9s" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="animation-delay: -0.6s; opacity: 0.7;" class="textOverlay" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.6s;" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="animation-delay: -0.3s; opacity: 0.5;" class="textOverlay" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.3s;" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="opacity: 0.3;" class="textOverlay" id="loadingScreenAnimY">
                    <div id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>
            </div>
        </div>

        <script src="../scripts/loading.js"></script>

        <!-- MAIN -->
        <div class="d-flex justify-content-center align-items-center min-vh-100 text-center" id="coverElement">
            <div class="border border-5 card w-50 h-100 p-5" style="border-style: double !important;">
                <a href="../index.html" class="text-start text-danger text-decoration-none">Back</a>

                <div class="d-flex justify-content-center">
                    <div class="w-50">
                        <img class="w-25 h-auto" src="../images/graceLogo.png" alt="GraceLogo"><br>
                    </div>
                </div>

                <span class="animate">
                    <h1 class="text-warning">Receipt Printer</h1>
                </span>

                <div class="fs-5 d-flex flex-column text-start" id="checkContainer">
                    <h2>Items</h2>

                    <div>
                        <input type="checkbox" id="Lantern" name="Lantern" value="100">
                        <label for="Lantern">Lantern</label>
                    </div>

                    <div>
                        <input type="checkbox" id="Gleam" name="Gleam" value="15000">
                        <label for="Gleam">Gleam</label>
                    </div>

                    <div>
                        <input type="checkbox" id="S.H.A.K.E" name="S.H.A.K.E" value="3000">
                        <label for="S.H.A.K.E">S.H.A.K.E</label>
                    </div>
                </div>

                <button py-click="generate" class="mt-5 mx-5">Print Receipt</button>

                <div class="mt-3 text-start">
                    <p  id="resultDisplay"></p>
                </div>

                <script type="py" src="../scripts/helper.py"></script>

                <script type="py">
                    from pyscript import document, display

                    result = ""

                    # === HELPER FUNCTIONS ===

                    # Receipt String Generator
                    def generateAnswer():
                        receipt = "<hr>"
                        total = 0

                        container = document.getElementById("checkContainer")
                        checkboxes = container.querySelectorAll("input[type='checkbox']")

                        # loop through all checkboxes
                        for box in checkboxes:
                            if not box.checked:
                                continue

                            boxPrice = box.value
                            if not "." in str(boxPrice):
                                boxPrice = int(boxPrice)

                            total += boxPrice
                            receipt += f"{boxPrice} Bricks - {str(box.id)}<br>"
                        
                        if total <= 0:
                            receipt += "No items added"

                        taxAdded = total * 0.12
                        prefix, separator, after = str(taxAdded).partition(".")

                        if len(after) == 1 and after == "0":
                            taxAdded = int(taxAdded)

                        finalReceipt = receipt + f"<hr>Tax (12%): {str(taxAdded)} Bricks<br>Total: {str(total + taxAdded)} Bricks"

                        return generateSuccess(finalReceipt, "Receipt", "fs-5")

                    # === MAIN ===

                    # String display
                    def generate(event):
                        document.getElementById("resultDisplay").innerHTML = generateAnswer()

                    # Runs on page load
                    def pageInit():
                        container = document.getElementById("checkContainer")
                        checkboxes = container.querySelectorAll("input[type='checkbox']")

                        # loop through all checkboxes
                        for box in checkboxes:
                            itemName = box.id
                            itemPrice = box.value
                            
                            label = container.querySelector(f"label[for='{itemName}']")
                            
                            if label:
                                label.innerHTML = f"{itemName} - <span style='color: #ff004b'>{itemPrice} Bricks</span>"

                    pageInit()
                </script>

                <!-- Bootstrap JavaScript -->

                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            </div>
        </div>
    </body>
</html>
