<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="../main.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="icon" type="image/x-icon" href="../images/graceFavicon.png">

        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

        <title>GraceShop - SKU Generator</title>
    </head>

    <body>
        <!-- PYSCRIPT LOADING BUFFER -->
        <div id="loadingScreen">
            <div id="loadingScreenAnimY" style="animation-duration: 3s;">
                <div id="loadingScreenAnimX">
                    <img src="../images/graceGod.png" alt="God">
                </div>
            </div>

            <div style="position: relative;">
                <div style="animation-delay: -0.9s" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.9s" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="animation-delay: -0.6s; opacity: 0.7;" class="textOverlay" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.6s;" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="animation-delay: -0.3s; opacity: 0.5;" class="textOverlay" id="loadingScreenAnimY">
                    <div style="animation-delay: -0.3s;" id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>

                <div style="opacity: 0.3;" class="textOverlay" id="loadingScreenAnimY">
                    <div id="loadingScreenAnimX">
                        <p>it's almost time.</p>
                    </div>
                </div>
            </div>
        </div>

        <script src="../scripts/loading.js"></script>

        <!-- MAIN -->
        <div class="d-flex justify-content-center align-items-center min-vh-100 text-center" id="coverElement">
            <div class="border border-5 card w-50 h-100 p-5" style="border-style: double !important;">
                <a href="../index.html" class="text-start text-danger text-decoration-none">Back</a>

                <div class="d-flex justify-content-center">
                    <div class="w-50">
                        <img class="w-25 h-auto" src="../images/graceLogo.png" alt="GraceLogo"><br>
                    </div>
                </div>

                <span class="animate">
                    <h1 class="text-warning">SKU Generator</h1>
                </span>

                <!-- Category Selection -->
                <label for="Category">Category</label>
                <select name="Category" id="Category">
                    <option value="None" disabled selected>None</option>
                    <option value="Item">Item</option>
                    <option value="Document">Document</option>
                    <option value="Merchandise">Merchandise</option>
                </select>

                <!-- Product Name (String) -->
                <label for="Product">Product Name</label>
                <input name="Product" id="Product" type="text" placeholder="Name"/>

                <!-- Stock Quantity (Number) -->
                <label for="Quantity">Stock Quantity</label>
                <input name="Quantity" id="Quantity" type="number" value="0"/>

                <button py-click="generate" class="mt-5 mx-5">Generate SKU</button>

                <div class="mt-3">
                    <p id="resultDisplay"></p>
                </div>

                <script type="py" src="../scripts/helper.py"></script>

                <script type="py">
                    from pyscript import document, display

                    result = ""

                    # === HELPER FUNCTIONS ===

                    # SKU String Generator
                    def generateAnswer():
                        prodCategory = document.getElementById("Category").value
                        
                        # error if no product selected
                        if prodCategory == "None":
                            return generateError("Product category cannot be \"none.\"")

                        # error if no product name is written
                        prodName = document.getElementById("Product").value
                        if prodName == "":
                            return generateError("Product name cannot be empty.")

                        # error if product amount is less than 0
                        prodQuantity = int(float(document.getElementById("Quantity").value))
                        if prodQuantity < 0:
                            return generateError("Product quantity cannot be less than 0")

                        finalSKU = f"{str(prodCategory)[0:3].upper()}-{str(prodName)[0:4].upper()}-{str(prodQuantity)}"

                        return generateSuccess(finalSKU, "Generated SKU")

                    # === MAIN ===

                    # String display
                    def generate(event):
                        document.getElementById("resultDisplay").textContent = generateAnswer()
                </script>

                <!-- Bootstrap JavaScript -->

                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            </div>
        </div>
    </body>
</html>
